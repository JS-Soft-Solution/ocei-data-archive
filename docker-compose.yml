services:

  # ── PHP-FPM app ──────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocei-archive-app
    working_dir: /var/www/html
    # Live-reload: any file you save on disk is instantly visible inside the container
    volumes:
      - ./app:/var/www/html
    environment:
      # Pass DB credentials so the entrypoint wait-for-mysql step can use them
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ocei_data_archive
      DB_USERNAME: ocei_user
      DB_PASSWORD: OceiArchive@2025
    depends_on:
      db:
        condition: service_healthy   # wait until MySQL passes its healthcheck
    networks:
      - ocei
    restart: unless-stopped

  # ── Nginx web server ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:stable-alpine
    container_name: ocei-archive-nginx
    ports:
      - "8090:80"
    volumes:
      - ./app:/var/www/html                                  # live source
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ocei
    restart: unless-stopped

  # ── MySQL 8 ──────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: ocei-archive-db
    restart: unless-stopped
    command: --innodb-buffer-pool-size=512M --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: OceiRoot@2025
      MYSQL_DATABASE: ocei_data_archive
      MYSQL_USER: ocei_user
      MYSQL_PASSWORD: OceiArchive@2025
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    # Healthcheck so the app service waits before running migrations
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ocei_user", "-pOceiArchive@2025"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - ocei

  # ── phpMyAdmin ───────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ocei-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: OceiRoot@2025
    ports:
      - "8091:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ocei

  # ── Node / Vite (optional) ───────────────────────────────────────────────────
  node:
    image: node:20-alpine
    container_name: ocei-archive-node
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    # Installs npm deps then keeps container alive; run `npm run dev` via exec
    command: sh -c "npm install && tail -f /dev/null"
    ports:
      - "5173:5173"
    networks:
      - ocei

volumes:
  db_data:

networks:
  ocei:
    driver: bridge
