services:

  # ── PHP-FPM 8.6/8.4 App (OCEI v2) ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocei-v2-app
    working_dir: /var/www/html
    # Live-reload: any file saved on disk is instantly reflected inside the container
    volumes:
      - ./app:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ocei_data_archive
      DB_USERNAME: ocei_user
      DB_PASSWORD: OceiArchive@2025
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ocei-v2
    restart: unless-stopped

  # ── Nginx Web Server (Port 8095) ───────────────────────────────────────────
  nginx:
    image: nginx:stable-alpine
    container_name: ocei-v2-nginx
    ports:
      - "8095:80"
    volumes:
      - ./app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ocei-v2
    restart: unless-stopped

  # ── MySQL 9.x Database (Port 3308) ─────────────────────────────────────────
  db:
    image: mysql:9.0
    container_name: ocei-v2-db
    restart: unless-stopped
    command: --default-authentication-plugin=caching_sha2_password --innodb-buffer-pool-size=512M --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: OceiRoot@2025
      MYSQL_DATABASE: ocei_data_archive
      MYSQL_USER: ocei_user
      MYSQL_PASSWORD: OceiArchive@2025
    ports:
      - "3308:3306"
    volumes:
      - db_v2_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ocei_user", "-pOceiArchive@2025"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - ocei-v2

  # ── phpMyAdmin (Port 8096) ─────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ocei-v2-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: OceiRoot@2025
    ports:
      - "8096:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ocei-v2

  # ── Node 26 LTS / Vite 8 Dev (Port 5174) ───────────────────────────────────
  node:
    image: node:26-alpine
    container_name: ocei-v2-node
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    command: sh -c "npm install --legacy-peer-deps && npm run build && tail -f /dev/null"
    ports:
      - "5174:5174"
    networks:
      - ocei-v2

volumes:
  db_v2_data:

networks:
  ocei-v2:
    driver: bridge
